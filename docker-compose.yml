name: nesto

services:
  nesto-cleanarquitecture-api:
    image: ${DOCKER_REGISTRY-}nesto-cleanarquitecture-api
    container_name: nesto-cleanarquitecture-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    depends_on:
      nesto-postgres:
        condition: service_healthy
      nesto-cache:
        condition: service_healthy
    ports:
      - 5000:8080
    environment:
      - ASPNETCORE_HTTP_PORTS=8080

  nesto-postgres:
    image: postgres:17-alpine
    container_name: nesto-postgres
    environment:
      - POSTGRES_DB=nestocleanarquitecture
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - nesto-postgres-data:/var/lib/postgresql/data
    ports:
      - 5440:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestocleanarquitecture"]
      interval: 3s
      timeout: 3s
      retries: 20

  nesto-cache:
    image: redis:7.4-alpine
    container_name: nesto-cache
    ports:
      - 6380:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  nesto-seq:
    image: datalust/seq:2024.3
    container_name: nesto-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8082:80
      - 5342:5341

volumes:
  nesto-postgres-data:
